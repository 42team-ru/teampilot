[project]
name = "telemost-bot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.44.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "minio>=7.2.7",
    "confluent-kafka>=2.5.0",
    "webrtcvad-wheels>=2.0.14",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
]

[tool.uv]
# openwakeword тянет tflite-runtime, у которого нет wheels под cp312 (только cp311).
# Мы используем onnxruntime (inference_framework=onnx), tflite не нужен — исключаем
# его недостижимым маркером платформы.
override-dependencies = ["tflite-runtime; sys_platform == 'disabled'"]
