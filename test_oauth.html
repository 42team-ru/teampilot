<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Telegram OAuth Test</title></head>
<body>
<h2>Telegram OAuth Test</h2>
<script
  src="https://telegram.org/js/telegram-widget.js?22"
  data-telegram-login="testd1ffbot"
  data-size="large"
  data-onauth="onAuth(user)"
  data-request-access="write">
</script>
<pre id="result"></pre>
<script>
async function onAuth(user) {
  document.getElementById('result').textContent = 'Telegram data:\n' + JSON.stringify(user, null, 2);
  const r = await fetch('http://localhost:8080/auth/telegram', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(user)
  });
  const data = await r.json();
  document.getElementById('result').textContent += '\n\nBackend response:\n' + JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
