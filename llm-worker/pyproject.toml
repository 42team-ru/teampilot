[project]
name = "llm-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "confluent-kafka>=2.5",
    "qdrant-client>=1.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "minio>=7.2",
    "openai>=1.0",
    "protobuf>=5.0",
    "pyrefly>=0.45.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.7",
    "grpcio-tools>=1.62",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
