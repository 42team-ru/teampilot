services:
    postgres:
        image: postgres:18.3
        environment:
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            POSTGRES_DB: ${DB_NAME:-postgres}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - my_pg_data:/var/lib/postgresql
            - ../database:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}" ]
            interval: 10s
            timeout: 5s
            retries: 20

    redpanda:
        image: redpandadata/redpanda:v25.3.7
        ports:
            - "9092:9092"
            - "19092:19092"
            - "8081:8081"
            - "9644:9644"
        volumes:
            - redpanda_data:/var/lib/redpanda/data
        command:
            - redpanda
            - start
            - --overprovisioned
            - --mode=dev-container
            - --kafka-addr=INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
            - --advertise-kafka-addr=INTERNAL://redpanda:19092,EXTERNAL://localhost:9092

    redpanda-init:
        image: redpandadata/redpanda:v25.3.7
        depends_on:
            - redpanda
        entrypoint: >
            /bin/sh -c "
              sleep 5 &&
              rpk topic create
                messages.raw
                users.events
                audio.upload
                files.uploaded
                tasks.confirmed
                tasks.rejected
                tasks.status
                tasks.state
                bots.tasks
                bots.notifications
                llm.tasks.create
                llm.status.change
              --brokers redpanda:19092 || true
            "
        restart: "no"

    redpanda-console:
        image: docker.redpanda.com/redpandadata/console:v3.5.2
        environment:
            CONFIG_FILEPATH: /etc/redpanda/redpanda-console-config.yaml
        volumes:
            - ./infrastructure/config/redpanda-console.yaml:/etc/redpanda/redpanda-console-config.yaml:ro
        ports:
            - "8000:8080"
        depends_on:
            - redpanda

    minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
            MINIO_SERVER_URL: ${S3_SERVER_URL:-http://localhost:9000}
            MINIO_BROWSER_REDIRECT_URL: ${S3_CONSOLE_URL:-http://minio.42team.ru}
        ports:
            - "${S3_PORT:-9000}:9000"
            - "${S3_CONSOLE_PORT:-9001}:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: [ "CMD", "mc", "ready", "local" ]
            interval: 10s
            timeout: 5s
            retries: 5

    qdrant:
        image: qdrant/qdrant:latest
        restart: always
        container_name: qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        expose:
            - 6333
            - 6334
            - 6335
        configs:
            - source: qdrant_config
              target: /qdrant/config/production.yaml
        volumes:
            - qdrant_data:/qdrant/storage

    caddy:
        image: caddy:2.11.2-alpine
        container_name: caddy
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./infrastructure/caddy/data:/data
            - ./infrastructure/caddy/config:/config
        environment:
            REDPANDA_CONSOLE_USER: ${REDPANDA_CONSOLE_USER:-admin}
            REDPANDA_CONSOLE_PASSWORD_HASH: ${REDPANDA_CONSOLE_PASSWORD_HASH}
        restart: unless-stopped

volumes:
    my_pg_data:
    redpanda_data:
    minio_data:
    qdrant_data:

networks:
  default:
    name: microservices-network

configs:
    qdrant_config:
        content: |
            log_level: INFO
