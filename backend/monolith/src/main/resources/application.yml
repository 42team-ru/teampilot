app:
    jwt:
        secret: ${APP_JWT_SECRET:bXlfc3VwZXJfc2VjcmV0X2tleV9mb3JfaGFja2F0aG9uXzIwMjQ=}
        expiration-days: 7
    bot:
        secret: ${BOT_SECRET:changeme}
    invite:
        expiration-days: 7
        bot-url: ${BOT_URL:t.me/prorab_bot}
    whisper:
        base-url: ${WHISPER_BASE_URL:http://localhost:8002}
        endpoint: ${WHISPER_ENDPOINT:/inference}
        model: ${WHISPER_MODEL:whisper-1}
    s3:
        endpoint: ${S3_ENDPOINT:http://localhost:9000}
        access-key: ${S3_ACCESS_KEY:minioadmin}
        secret-key: ${S3_SECRET_KEY:minioadmin}
        region: ${S3_REGION:us-east-1}
        default-bucket: ${S3_DEFAULT_BUCKET:audio}
        presigned-url-expiry: ${S3_PRESIGNED_URL_EXPIRY:15m}

spring:
    application:
        name: monolith
    profiles:
        default: dev

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer:
            group-id: ${KAFKA_CONSUMER_GROUP_ID:monolith-consumer}

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
        username: ${SPRING_DATASOURCE_USERNAME:myuser}
        password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update

server:
    port: ${SERVER_PORT:8080}

springdoc:
    api-docs:
        path: /v3/api-docs
    packages-to-scan: ru.team42.monolith.rest
    default-produces-media-type: application/json

management:
    endpoints:
        web:
            exposure:
                include: health,info
debug: false
