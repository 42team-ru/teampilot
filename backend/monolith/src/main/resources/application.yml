spring:
    application:
        name: monolith
    profiles:
        default: dev

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase?currentSchema=monolit_schema}
        username: ${SPRING_DATASOURCE_USERNAME:myuser}
        password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate

    security:
        oauth2:
            client:
                registration:
                    yandex:
                        client-id: ${YANDEX_CLIENT_ID:44e56508f4ca453687ab62c9ef0717ac}
                        client-secret: ${YANDEX_CLIENT_SECRET:9c5c001384334971b0d5611c9bfb1b7c}
                        client-authentication-method: client_secret_basic
                        authorization-grant-type: authorization_code
                        redirect-uri: "${app.oauth2.redirect-base-url}/login/oauth2/code/yandex"
                        scope:
                            - login:email
                            - login:info
                            - login:avatar
                        client-name: Yandex
                    github:
                        client-id: ${GITHUB_CLIENT_ID:change-me}
                        client-secret: ${GITHUB_CLIENT_SECRET:change-me}
                        client-authentication-method: client_secret_basic
                        authorization-grant-type: authorization_code
                        redirect-uri: "${app.oauth2.redirect-base-url}/login/oauth2/code/github"
                        scope:
                            - user:email
                            - read:user
                        client-name: GitHub
                provider:
                    yandex:
                        authorization-uri: https://oauth.yandex.ru/authorize
                        token-uri: https://oauth.yandex.ru/token
                        user-info-uri: https://login.yandex.ru/info
                        user-name-attribute: login

    flyway:
        locations: classpath:db/migration
        enabled: true

server:
    port: ${SERVER_PORT:8080}

rsa:
    private-key: classpath:keys/private_key.pem
    public-key: classpath:keys/public_key.pem

jwt:
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:900}       # 15 минут
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:2592000} # 30 дней
    issuer: ${JWT_ISSUER:http://localhost:8080}

cookie:
    secure: ${COOKIE_SECURE:false}
    sameSite: ${COOKIE_SAME_SITE:Lax}

app:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    oauth2:
        redirect-base-url: ${APP_OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}

    cors:
        allowed-origins:
            - http://localhost:5173
            - http://localhost:3000
            - http://42team.ru
            - https://42team.ru
        allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
        allowed-headers:
            - "*"
        allow-credentials: true
        max-age: 3600

springdoc:
    api-docs:
        path: /v3/api-docs
    packages-to-scan: ru.team42.monolith.controller
    default-produces-media-type: application/json

management:
    endpoints:
        web:
            exposure:
                include: health,info
debug: true
