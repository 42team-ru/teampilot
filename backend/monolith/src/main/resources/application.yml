spring:
    application:
        name: monolith
    profiles:
        default: dev

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer:
            group-id: ${KAFKA_CONSUMER_GROUP_ID:monolith-consumer}

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
        username: ${SPRING_DATASOURCE_USERNAME:myuser}
        password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update

server:
    port: ${SERVER_PORT:8080}

springdoc:
    api-docs:
        path: /v3/api-docs
    packages-to-scan: ru.team42.monolith.rest
    default-produces-media-type: application/json

management:
    endpoints:
        web:
            exposure:
                include: health,info
debug: false
