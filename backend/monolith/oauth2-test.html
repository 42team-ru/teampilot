<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; padding: 32px; }
        h2 { color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 14px; }
        .btn-github { background: #24292e; color: #fff; }
        .btn-yandex  { background: #fc3f1d; color: #fff; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-danger  { background: #dc2626; color: #fff; }
        .btn-secondary { background: #2a2a2a; color: #e0e0e0; border: 1px solid #3a3a3a; }
        input { background: #111; border: 1px solid #333; color: #e0e0e0; padding: 9px 12px; border-radius: 6px; font-family: monospace; font-size: 14px; width: 100%; margin-bottom: 8px; }
        pre { background: #111; border: 1px solid #222; border-radius: 6px; padding: 14px; font-size: 13px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
        .status { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        .ok  { background: #14532d; color: #86efac; }
        .err { background: #7f1d1d; color: #fca5a5; }
        .note { color: #555; font-size: 12px; margin-top: 8px; }
        hr { border: none; border-top: 1px solid #222; margin: 6px 0 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>OAuth2 Login</h2>
    <hr>
    <p class="note" style="margin-bottom:12px">Страница должна быть открыта на <b>http://localhost:5173</b> — иначе callback от провайдера вернётся не сюда.</p>
    <div class="row">
        <button class="btn-github" onclick="oauthLogin('github')">GitHub</button>
        <button class="btn-yandex"  onclick="oauthLogin('yandex')">Yandex</button>
    </div>
</div>

<div class="card">
    <h2>Email / Password Login</h2>
    <hr>
    <input id="username" placeholder="username" value="admin">
    <input id="password" placeholder="password" type="password" value="admin">
    <div class="row">
        <button class="btn-primary" onclick="login()">Войти</button>
    </div>
</div>

<div class="card">
    <h2>Auth State</h2>
    <hr>
    <div class="row" style="margin-bottom:14px">
        <button class="btn-secondary" onclick="checkMe()">GET /user/me</button>
        <button class="btn-danger"    onclick="logout()">Logout</button>
    </div>
    <div id="status-label"></div>
    <pre id="output">—</pre>
</div>

<script>
    const API = 'http://localhost:8080';

    function show(data, ok = true) {
        document.getElementById('status-label').innerHTML =
            `<span class="status ${ok ? 'ok' : 'err'}">${ok ? 'OK' : 'ERROR'}</span>`;
        document.getElementById('output').textContent =
            typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    function oauthLogin(provider) {
        window.location.href = `${API}/oauth2/authorization/${provider}`;
    }

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, deviceType: 'WEB' }),
            });
            const data = await res.json();
            show(data, res.ok);
        } catch (e) {
            show(e.message, false);
        }
    }

    async function checkMe() {
        try {
            const res = await fetch(`${API}/user/me`, { credentials: 'include' });
            const data = await res.json();
            show(data, res.ok);
        } catch (e) {
            show(e.message, false);
        }
    }

    async function logout() {
        try {
            const res = await fetch(`${API}/auth/logout`, {
                method: 'POST',
                credentials: 'include',
            });
            const data = await res.json();
            show(data, res.ok);
        } catch (e) {
            show(e.message, false);
        }
    }

    // Автоматически проверяем /user/me после OAuth2 callback
    if (window.location.pathname === '/auth/oauth2/callback') {
        show('OAuth2 callback получен, проверяю /user/me...', true);
        checkMe();
    }
</script>

</body>
</html>
