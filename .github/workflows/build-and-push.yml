name: Build and Push Docker Images

on:
  push:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      monolith: ${{ steps.filter.outputs.monolith }}
      bot: ${{ steps.filter.outputs.bot }}
      llm-worker: ${{ steps.filter.outputs.llm-worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            monolith:
              - 'backend/monolith/**'
              - 'backend/core/**'
              - 'backend/build.gradle.kts'
              - 'backend/settings.gradle.kts'
              - 'backend/gradle/**'
            bot:
              - 'bot/**'
            llm-worker:
              - 'llm-worker/**'

  build-monolith:
    needs: changes
    if: needs.changes.outputs.monolith == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x backend/gradlew
      - name: Build and push via Jib
        run: |
          cd backend
          ./gradlew --no-daemon :monolith:jib \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

  build-bot:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-llm-worker:
    needs: changes
    if: needs.changes.outputs.llm-worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./llm-worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/llm-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

